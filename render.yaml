services:
  - type: web
    name: dermready-hackathon
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements-web.txt
    startCommand: python app.py --host 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: DERMREADY_CHECKPOINT_DIR
        value: /etc/secrets
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
